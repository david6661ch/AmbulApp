<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambul-app | Iniciar sesión</title>
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="login-shell">
      <aside class="login-visual" aria-label="Imagen promocional Ambul-app">
        <div class="login-brand">
          <div class="brand-mark">A</div>
          <span class="brand-name">Ambul-app</span>
        </div>

        <div class="login-promo">
          <span class="eyebrow">Transporte que cuida</span>
          <h1>Tu tranquilidad<br />empieza aquí.</h1>
          <p>
            Gestiona tus traslados médicos de forma simple, segura y humana.
          </p>
        </div>
      </aside>

      <main class="login-panel">
        <a href="../index.html" class="back-link">← Volver al inicio</a>

        <section class="login-card" aria-labelledby="login-title">
          <p class="kicker">ACCEDE A TU CUENTA</p>
          <h2 id="login-title">Bienvenido de nuevo</h2>
          <p class="subtitle">Ingresa tus datos para continuar.</p>

          <form id="loginForm" novalidate>
            <div class="form-group">
              <label for="email">Usuario o correo electrónico</label>
              <div class="input-wrap">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5v-11Z"></path>
                  <path d="m4.8 6.2 7.2 6 7.2-6"></path>
                </svg>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="username"
                  placeholder="tu@correo.com"
                  aria-label="Usuario o correo electrónico"
                />
              </div>
            </div>

            <div class="form-group">
              <label for="password">Contraseña</label>
              <div class="input-wrap">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                  <path d="M8 10V7.5A4 4 0 0 1 12 4a4 4 0 0 1 4 3.5V10"></path>
                </svg>
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="Ingresa tu contraseña"
                  aria-label="Contraseña"
                />
                <button type="button" class="password-toggle" aria-label="Mostrar u ocultar contraseña">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-row">
              <label class="remember" for="remember">
                <input id="remember" type="checkbox" name="remember" />
                <span>Recordarme</span>
              </label>
              <a href="recuperar-password.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="submit-btn">
              <span>Iniciar sesión</span>
              <span class="arrow" aria-hidden="true">→</span>
            </button>

            <p id="formMessage" class="form-message" aria-live="polite"></p>

            <p class="register-line">
              ¿No tienes cuenta?
              <a href="registro.html">Regístrate</a>
            </p>
          </form>
        </section>
      </main>
    </div>

    <script src="../js/login.js"></script>
  </body>
</html>
