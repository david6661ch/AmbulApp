<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap example</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <!-- Paste the Bootstrap CSS <link> from getbootstrap.com here -->
</head>
<body>

  <div class="container mt-4">
    <h1 class="text-center text-primary mb-4">My first Bootstrap page</h1>

    <div class="row">
      <div class="col-12 col-md-6">
        <div class="card">
          <div class="card-body">
            <h2 class="card-title h5">Card one</h2>
            <p class="card-text">This card is half the width on medium screens and up.</p>
            <a href="#" class="btn btn-primary">Click me</a>
          </div>
        </div>
      </div>
      <p class="text-danger btn btn-primary">This text is red</p>
      <div class="col-12 col-md-6">
        <div class="card">
          <div class="card-body">
            <h2 class="card-title h5">Card two</h2>
            <p class="card-text">On a phone, the two cards stack vertically.</p>
            <a href="#" class="btn btn-outline-secondary">Another button</a>
          </div>
        </div>
      </div>
    </div>
  </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  <!-- Paste the Bootstrap JS <script> from getbootstrap.com here -->
</body>
</html>
